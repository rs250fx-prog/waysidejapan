name: daily-publish

# 予約公開（pubDate が未来の記事）を、その日の日本時間 0時台に出すための再ビルド。
# 静的サイトなので、日付が変わっても勝手には公開されない。空コミットを push して Pages に作り直させる。
#
# シークレットは要らない（GITHUB_TOKEN だけで動く。rates.yml と同じ方式）。
# その日が pubDate の記事が1本も無ければ何もしない。ビルド枠は月500回（アカウント共有）なので、
# 公開する日だけ消費する。公開計画は docs/publish-plan.json、日付の書き込みは tools/schedule-publish.mjs。

on:
  schedule:
    # 15:05 UTC = 翌 00:05 JST
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 権限が無いなら、何もせずに落ちる
      - name: Check push access
        run: git push --dry-run origin HEAD:${{ github.ref_name }}

      # 1. ヒーローを足したのに計画に無い記事を、計画の末尾に足す（pubDate は未来の日付になる）
      # 2. その日が pubDate の記事があれば、空コミットで再ビルドさせる
      - name: Fill the plan, then push if anything changes or goes live today
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          git config user.name "wayside-bot"
          git config user.email "actions@users.noreply.github.com"

          node tools/schedule-publish.mjs --fill --apply
          git add docs/publish-plan.json src/content
          if ! git diff --cached --quiet; then
            git commit -m "chore: 公開計画に追加（${TODAY}）"
            git push
            exit 0
          fi

          if ! grep -rqE "^pubDate: ${TODAY}\s*$" src/content; then
            echo "${TODAY} に公開する記事はありません"
            exit 0
          fi
          git commit --allow-empty -m "chore: ${TODAY} の予約公開を反映"
          git push
