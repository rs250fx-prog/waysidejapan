name: daily-publish

# 予約公開（pubDate が未来の記事）を、その日の日本時間 0時台に出すための再ビルド。
# 静的サイトなので、日付が変わっても勝手には公開されない。Pages のデプロイフックを叩いて作り直す。
# ビルド枠は月500回（アカウント共有）。毎日1回＝月30回。
#
# 事前準備：Cloudflare Pages の Settings > Builds > Deploy hooks でフックを作り、
# その URL を GitHub の Secrets に CF_DEPLOY_HOOK として登録する。

on:
  schedule:
    # 15:05 UTC = 翌 00:05 JST
    - cron: '5 15 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pages build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK が未登録です" >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
